<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Radar de Integridade Assistencial | Acesso restrito</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 12% 20%,#146c43 0%,#082c1e 35%,#041b12 80%);color:#effff3;display:grid;place-items:center}
main{width:min(470px,calc(100vw - 36px));padding:42px;background:rgba(4,34,22,.77);border:1px solid rgba(184,255,82,.24);border-radius:20px;box-shadow:0 20px 90px #00160a80}
small{font-weight:750;letter-spacing:.19em;color:#b8ff52;text-transform:uppercase}h1{font-size:clamp(34px,5vw,54px);line-height:1.04;letter-spacing:-.055em;margin:24px 0}p{opacity:.82;line-height:1.6}label{display:block;margin-top:22px;margin-bottom:8px;font-weight:700}input{display:block;width:100%;padding:14px 16px;color:#fff;background:#052a1b;border:1px solid #408964;border-radius:9px;font-size:17px}button{margin-top:16px;width:100%;border:0;background:#b8ff52;color:#0e2616;border-radius:9px;padding:15px;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{font-size:14px;min-height:22px;overflow-wrap:anywhere}footer{margin-top:24px;font-size:12px;opacity:.65}#viewer{position:fixed;inset:0;border:0;width:100%;height:100%;display:none;background:#052416}
</style>
</head>
<body>
<main id="gate">
<small>Projeto Transforma · Acesso restrito</small>
<h1>Radar de<br>Integridade<br>Assistencial<span style="color:#b8ff52">.</span></h1>
<p>Esta apresentação está criptografada. Informe a senha compartilhada pela equipe para desbloqueá-la neste navegador.</p>
<form id="unlock">
<label for="password">Senha de acesso</label>
<input id="password" type="password" required autocomplete="off" autofocus>
<button id="submit" type="submit">Abrir apresentação</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
<footer>A senha não é enviada a um servidor. A descriptografia acontece apenas neste dispositivo.</footer>
</main>
<iframe id="viewer" title="Radar de Integridade Assistencial" allow="fullscreen" allowfullscreen sandbox="allow-scripts allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
<script>
'use strict';
const form=document.getElementById('unlock'),password=document.getElementById('password'),status=document.getElementById('status'),submit=document.getElementById('submit'),gate=document.getElementById('gate'),viewer=document.getElementById('viewer');
let encrypted=null,presentationHtml=null,telao=null;
async function loadPayload(){
 if(encrypted)return encrypted;
 const response=await fetch('./payload.bin',{cache:'no-store'});
 if(!response.ok)throw Error('Apresentação criptografada ainda não foi publicada.');
 const bytes=new Uint8Array(await response.arrayBuffer());
 if(bytes.byteLength<64||new TextDecoder().decode(bytes.subarray(0,4))!=='RDR1')throw Error('Arquivo criptografado inválido.');
 encrypted=bytes;return bytes;
}
form.addEventListener('submit',async event=>{
 event.preventDefault();submit.disabled=true;status.textContent='Validando e descriptografando…';
 try{
  const pass=password.value,bytes=await loadPayload();
  const salt=bytes.slice(4,20),iv=bytes.slice(20,32),data=bytes.slice(32);
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,data);
  const html=new TextDecoder('utf-8',{fatal:true}).decode(plain);
  password.value='';presentationHtml=html;viewer.srcdoc=html;gate.style.display='none';viewer.style.display='block';document.body.style.display='block';
 }catch(err){status.textContent=err.message==='Apresentação criptografada ainda não foi publicada.'?err.message:'Não foi possível abrir. Verifique a senha e tente novamente.';}finally{submit.disabled=false}
});
// V12.3 · telão: the presentation runs in a sandboxed iframe, so this page opens the projector window
// with the same (already decrypted) content and relays the sync messages between both.
window.addEventListener('message',event=>{
 const d=event.data;if(!d||d.source!=='radar-v12'||!presentationHtml)return;
 if(event.source===viewer.contentWindow){
  if(d.kind==='relay-open-telao'){
   if(telao&&!telao.closed){telao.focus();return}
   telao=window.open('','radar-v12-telao','width=1500,height=900');
   if(!telao)return;
   telao.document.open();
   telao.document.write(presentationHtml.replace('<head>','<head><script>window.RADAR_TELAO=true<\/script>'));
   telao.document.close();
  }else if(d.kind==='relay'&&telao&&!telao.closed){telao.postMessage(d.msg,'*')}
 }else if(telao&&event.source===telao){viewer.contentWindow.postMessage(d,'*')}
});
</script></body></html>
